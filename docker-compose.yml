# Local development. Production uses managed Postgres + KMS/HSM (docs/deployment.md).
#
#   docker compose up -d db          # database only (default dev loop)
#   docker compose --profile app up  # full stack: build the server image + db
#
# The app profile expects dev signing keys in ./keys/local (npm run keygen) and
# uses throwaway dev secrets — never reuse these values outside localhost.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: licensing
      POSTGRES_PASSWORD: licensing
      POSTGRES_DB: licensing
    ports:
      - "5432:5432"
    volumes:
      - licensing_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U licensing"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    profiles: ["app"]
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      LICENSING_ENV: development
      LICENSING_HTTP_PORT: "8080"
      DATABASE_URL: postgres://licensing:licensing@db:5432/licensing
      SIGNING_PROVIDER: local
      LOCAL_KEYS_DIR: /keys
      ACTIVE_SIGNING_KEY_ID: ${ACTIVE_SIGNING_KEY_ID:-key-2026-01}
      TOKEN_ISSUER: http://localhost:8080
      TOKEN_AUDIENCE: vehiclevo-products
      ACTIVATION_CODE_PEPPER: local-dev-pepper-not-secret
      ADMIN_API_KEY: local-dev-admin-key
    volumes:
      - ./keys/local:/keys:ro
    ports:
      - "8080:8080"

volumes:
  licensing_pgdata:
