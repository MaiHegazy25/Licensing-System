name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Typecheck, build, test (with Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: licensing
          POSTGRES_PASSWORD: licensing
          POSTGRES_DB: licensing_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U licensing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck + compile (shared/server/sdk)
        run: npx tsc --build

      - name: Build admin portal
        run: npm run build -w @vehiclevo/licensing-admin-web

      - name: Build customer portal
        run: npm run build -w @vehiclevo/licensing-customer-web

      - name: Tests (unit + Postgres integration)
        env:
          # postgres.test.ts DROPS the schema of this database on startup —
          # it must always point at the throwaway service container above.
          TEST_DATABASE_URL: postgres://licensing:licensing@localhost:5432/licensing_test
        run: npx vitest run

      - name: Dependency audit (advisory)
        # Non-blocking: surfaces new advisories without letting an upstream
        # disclosure brick unrelated PRs. Review failures in the job log.
        run: npm audit --audit-level=high || true

  image:
    name: Build + push server image (main only)
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/licensing-server
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/${{ github.repository }}/licensing-server:latest
          format: spdx-json
          artifact-name: licensing-server-sbom.spdx.json

      - name: Scan image for vulnerabilities
        uses: anchore/scan-action@v6
        with:
          image: ghcr.io/${{ github.repository }}/licensing-server:latest
          fail-build: false # advisory; tighten to true once a baseline is triaged
          severity-cutoff: high

  # Deployment is intentionally NOT automated here: it needs cloud credentials
  # and a target that belong to the operating team. docs/deployment.md shows the
  # exact job to add (Azure Container Apps example) once secrets are configured.
